name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to narrow the test run'
        required: false
        default: ''

jobs:
  tests:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: 3.9
          - tox-env: py310
            python-version: '3.10'
          - tox-env: py311
            python-version: '3.11'
          - tox-env: nolxml
            python-version: '3.11'
          - tox-env: nohtml5lib
            python-version: '3.10'
          # The Linux runners now provision a CPython micro whose `html.parser`
          # treats `<iframe>` content as raw text, so the `*_iframe` tests see an
          # empty sub-document. Pin the release-era micro on Linux only; the
          # Windows image does not carry these older micros.
          - platform: ubuntu-22.04
            tox-env: py37
            python-version: '3.7.16'
          - platform: ubuntu-22.04
            tox-env: py38
            python-version: '3.8.16'
          - platform: ubuntu-22.04
            tox-env: py39
            python-version: '3.9.16'
          - platform: ubuntu-22.04
            tox-env: py310
            python-version: '3.10.11'
          - platform: ubuntu-22.04
            tox-env: py311
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nolxml
            python-version: '3.11.3'
          - platform: ubuntu-22.04
            tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' --upgrade pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox ${{ inputs.test-filter != '' && format('-- -k ''{0}''', inputs.test-filter) || '' }}
